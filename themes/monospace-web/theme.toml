name = 'Monospace Web'
license = 'MIT'
licenselink = 'https://github.com/rfaulhaber/monospace-web-hugo/blob/main/LICENSE'
description = 'A Hugo port of the-monospace-web: everything aligned to a monospace character grid.'

homepage = 'https://github.com/rfaulhaber/monospace-web-hugo'
demosite = 'https://rfaulhaber.github.io/monospace-web-hugo/'

min_version = '0.146.0'

tags = ['monospace', 'minimal', 'blog', 'dark mode', 'responsive', 'no javascript frameworks']
features = ['monospace', 'grid', 'dark mode', 'rss', 'taxonomies', 'table of contents', 'syntax highlighting']

[author]
  name = 'Ryan Faulhaber'
  homepage = 'https://github.com/rfaulhaber'

[original]
  author = 'Oskar Wickström'
  homepage = 'https://wickstrom.tech/'
  repo = 'https://github.com/owickstrom/the-monospace-web'
